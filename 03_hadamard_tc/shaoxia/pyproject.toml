[project]
name = "hadamard-bench"
version = "0.1.0"
description = "Benchmark our CUDA Hadamard kernel vs fast-hadamard-transform"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "fast-hadamard-transform",
]

# fast-hadamard-transform is vendored in third-party/ (built from source).
[tool.uv.sources]
fast-hadamard-transform = { path = "third-party/fast-hadamard-transform" }

# fast-hadamard-transform ships only a legacy setup.py (no pyproject.toml)
# whose setup.py imports torch, setuptools, wheel and packaging at build time
# to compile a CUDA extension, but declares none of them as build dependencies.
# uv's isolated build env for such a package therefore lacks torch and the build
# fails. scripts/vendor-fht.sh writes a small pyproject.toml into the vendored
# package that declares the real build-system.requires, so `uv sync` (and
# `uv lock`) can build it correctly with default build isolation.

# To pin the exact CUDA variant on a new machine, add e.g.:
#   [[tool.uv.index]]
#   name = "pytorch-cu130"
#   url = "https://download.pytorch.org/whl/cu130"
#   explicit = true
#   [tool.uv.sources]
#   torch = { index = "pytorch-cu130" }
# and pin "torch==2.13.0+cu130" in dependencies.
